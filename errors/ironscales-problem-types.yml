format_note: 'IRONSCALES does not use RFC 9457 problem+json. The specification declares application/json as the
  only produced media type and attaches NO response schema to any 4xx/5xx response — every error response in the
  contract is a bare description string. There is therefore no machine-readable error envelope, no error `type`
  URI, and no stable error code vocabulary an agent can branch on: only the HTTP status code is contractual. The
  three statuses in the `general` block below are the only ones the provider documents in prose, in the specification''s
  own info.description table.'
