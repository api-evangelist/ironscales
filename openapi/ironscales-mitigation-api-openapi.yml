openapi: 3.2.0
info:
  title: IRONSCALES Management Mitigation API
  description: 'General Error Responses:


    HTTP Status Codes

    Reason


    400

    Not authenticated


    403

    Insufficient rights to call this procedure


    429

    Too many requests (Throttling) the limit is 120 API calls per minute per company'
  termsOfService: https://staticmediafiles.s3.amazonaws.com/static/webapp/docs/IronScalesTermsnService.pdf
  contact:
    email: support@ironscales.com
  securityDefinitions:
    Bearer:
      type: JWT
      name: Authorization
      in: header
  version: v1
servers:
- url: https://appapi.ironscales.com/appapi
security:
- JWT: []
tags:
- name: Mitigation
paths:
  /mitigation/{company_id}/details/:
    parameters:
    - name: company_id
      in: path
      required: true
      schema:
        type: string
    post:
      operationId: Get details of mitigations per mailbox
      description: 'Get details of mitigations per mailbox


        Scopes:


        partner.all


        partner.company.view


        company.view


        Period values:


        0 - Last 24 hours


        1 - Last 7 days


        2 - Last 90 days


        3 - Last 180 days


        4 - Last 360 days


        5 - Current year to date


        6 - All time (Default)'
      parameters:
      - name: company_id
        in: path
        description: company id
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MitigationPageDetails'
        '400':
          description: Error explanation in error_message
          content:
            application/json:
              example:
                error_message: explanation
        '404':
          description: Company was not found
        '403':
          description: No permissions
      tags:
      - Mitigation
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IncidentDetailsRequest'
        required: true
      summary: Get details of mitigations per mailbox
      x-summary-source: derived
  /mitigation/{company_id}/impersonation/details/:
    parameters:
    - name: company_id
      in: path
      required: true
      schema:
        type: string
    get:
      operationId: Get the latest company impersonation incidents
      description: 'Get the latest company impersonation incidents


        Results are limited to the latest 1000 incidents, a message will appear

        displaying if the amount of incidents in the period is over this limit


        Please note that the IDs returned here are of impersonation attempts,

        not incidents or reports, so searching these IDs in other endpoints

        will not return the expected incidents


        Scopes:


        partner.all


        partner.company.view


        company.view


        Period values:


        0 - Last 24 hours


        1 - Last 7 days


        2 - Last 90 days


        3 - Last 180 days


        4 - Last 360 days


        5 - Current year to date


        6 - All time'
      parameters:
      - name: company_id
        in: path
        description: company id
        required: true
        schema:
          type: integer
      - name: period
        in: query
        description: period
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImpersonationDetailsPage'
        '400':
          description: Error explanation in error_message
          content:
            application/json:
              example:
                error_message: explanation
        '404':
          description: Company was not found
        '403':
          description: No permissions
      tags:
      - Mitigation
      summary: Get the latest company impersonation incidents
      x-summary-source: derived
    post:
      operationId: Get the latest company impersonation paginated incidents
      description: 'Get the latest company impersonation paginated incidents


        Please note that the IDs returned here are of impersonation attempts,

        not incidents or reports, so searching these IDs in other endpoints

        will not return the expected incidents


        Scopes:


        partner.all


        partner.company.view


        company.view


        Period values:


        0 - Last 24 hours


        1 - Last 7 days


        2 - Last 90 days


        3 - Last 180 days


        4 - Last 360 days


        5 - Current year to date


        6 - All time'
      parameters:
      - name: company_id
        in: path
        description: company id
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImpersonationDetailsPage'
        '400':
          description: Error explanation in error_message
          content:
            application/json:
              example:
                error_message: explanation
        '404':
          description: Company was not found
        '403':
          description: No permissions
      tags:
      - Mitigation
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImpersonationDetailsRequest'
        required: true
      summary: Get the latest company impersonation paginated incidents
      x-summary-source: derived
  /mitigation/{company_id}/incidents/details/:
    parameters:
    - name: company_id
      in: path
      required: true
      schema:
        type: string
    get:
      operationId: Get a company mitigation details
      description: 'Get a company mitigation details


        Scopes:


        partner.all


        partner.company.view


        company.view


        Period values:


        0 - Last 24 hours


        1 - Last 7 days


        2 - Last 90 days


        3 - Last 180 days


        4 - Last 360 days


        5 - Current year to date


        6 - All time'
      parameters:
