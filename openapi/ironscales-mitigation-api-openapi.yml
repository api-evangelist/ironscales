          - integer
          - 'null'
        avg_resolution_time:
          title: Avg resolution time
          type:
          - number
          - 'null'
        total:
          title: Total
          type:
          - integer
          - 'null'
    MitigationDetails:
      required:
      - incidentID
      - mitigationID
      - incidentState
      - remediatedTime
      - mailboxId
      - mailboxEmail
      - subject
      - senderEmail
      - senderIP
      - reportedBy
      - resolution
