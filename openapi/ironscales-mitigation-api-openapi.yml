          type: integer
        mitigationID:
          title: Mitigationid
          type: integer
        incidentState:
          title: Incidentstate
          type: string
          minLength: 1
        remediatedTime:
          title: Remediatedtime
          type: string
          format: date-time
        mailboxId:
          title: Mailboxid
          type: integer
        mailboxEmail:
          title: Mailboxemail
          type: string
          minLength: 1
        subject:
          title: Subject
          type: string
          minLength: 1
        senderEmail:
