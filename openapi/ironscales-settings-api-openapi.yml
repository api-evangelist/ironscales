openapi: 3.2.0
info:
  title: IRONSCALES Management Settings API
  description: 'General Error Responses:


    HTTP Status Codes

    Reason


    400

    Not authenticated


    403

    Insufficient rights to call this procedure


    429

    Too many requests (Throttling) the limit is 120 API calls per minute per company'
  termsOfService: https://staticmediafiles.s3.amazonaws.com/static/webapp/docs/IronScalesTermsnService.pdf
  contact:
    email: support@ironscales.com
  securityDefinitions:
    Bearer:
      type: JWT
      name: Authorization
      in: header
  version: v1
servers:
- url: https://appapi.ironscales.com/appapi
security:
- JWT: []
tags:
- name: Settings
paths:
  /settings/{company_id}/account-takeover/:
    parameters:
    - name: company_id
      in: path
      required: true
      schema:
        type: string
    get:
      operationId: Get account takeover sensitivity settings
      description: 'Retrieve the account takeover sensitivity settings for the specified company.


        Sensitivity Options:


        1 (Aggressive): Most sensitive - requires fewer alerts to trigger an incident


        2 (Balanced): Default sensitivity level


        3 (Relaxed): Least sensitive - requires more alerts to trigger an incident


        Scopes:


        company.all


        company.view'
      responses:
        '200':
          description: Successful response containing account takeover sensitivity settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountTakeoverSettings'
              example:
                sensitivity: 2
        '404':
          description: Company was not found
          content:
            application/json:
              example:
              - message: Company not found
        '403':
          description: Permission Denied
          content:
            application/json:
              example:
              - detail: Missing JWT
              - detail: You do not have permission to perform this action.
              - message: You do not have permission for company <company_id>
        '429':
          description: Too many requests
          content:
            application/json:
              example:
              - detail: Request was throttled. Expected available in 60 seconds.
      tags:
      - Settings
      summary: Get account takeover sensitivity settings
      x-summary-source: derived
    put:
      operationId: Update account takeover sensitivity settings
      description: 'Update account takeover sensitivity settings for the specified company.


        Sensitivity Options:


        1 (Aggressive): Most sensitive - requires fewer alerts to trigger an incident


        2 (Balanced): Default sensitivity level


        3 (Relaxed): Least sensitive - requires more alerts to trigger an incident


        Scopes:


        company.all


        company.edit'
      responses:
        '200':
          description: Successfully updated account takeover sensitivity settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountTakeoverSettings'
              example:
                sensitivity: 3
        '400':
          description: Invalid request body - validation errors
          content:
            application/json:
              schema:
                type: object
                properties:
                  sensitivity:
                    description: Field validation errors
                    type: array
                    items:
                      type: string
              example:
                sensitivity:
                - This field is required.
        '404':
          description: Company was not found
          content:
            application/json:
              example:
              - message: Company not found
        '403':
          description: Permission Denied
          content:
            application/json:
              example:
              - detail: Missing JWT
              - detail: You do not have permission to perform this action.
              - message: You do not have permission for company <company_id>
        '429':
          description: Too many requests
          content:
            application/json:
              example:
              - detail: Request was throttled. Expected available in 60 seconds.
      tags:
      - Settings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountTakeoverSettings'
        required: true
      summary: Update account takeover sensitivity settings
      x-summary-source: derived
  /settings/{company_id}/allow-list/:
    parameters:
    - name: company_id
      in: path
      required: true
      schema:
        type: string
    get:
      operationId: Get allow list settings
      description: 'Retrieve the list of allow list settings for the specified company.

        Scopes:


        company.all


        company.view'
      parameters:
      - name: sort
        in: query
        description: 'Options: type | scope | date | allowed_for | noSorting'
        required: false
        schema:
          type: string
          enum:
          - type
          - scope
          - date
          - allowed_for
          - noSorting
          default: noSorting
      - name: order
        in: query
        description: 'Options: desc | asc'
        required: false
        schema:
          type: string
          enum:
          - desc
          - asc
          default: desc
      - name: type
        in: query
        description: Filter by entry type.
        required: false
        schema:
          type: string
          enum:
          - all
          - ip
          - domain
          - address
          - link_domain
          default: all
      - name: search
        in: query
        description: Search term to filter entries by their value field (case-insensitive partial match).
        required: false
        schema:
          type: string
      - name: page
        in: query
        description: Page number for pagination results. Starts at 1.
        required: false
        schema:
          type: integer
          default: 1
          minimum: 1
      - name: items_per_page
        in: query
        description: 'Number of items per page in pagination results. Min: 1, Max: 500, Default: 100.'
        required: false
        schema:
          type: integer
          default: 100
          maximum: 500
          minimum: 1
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhiteListResponse'
        '404':
          description: Company was not found
          content:
            application/json:
              example:
              - message: Company not found
        '403':
          description: Permission Denied
          content:
            application/json:
              example:
              - detail: Missing JWT
              - detail: You do not have permission to perform this action.
              - message: You do not have permission for company <company_id>
        '400':
          description: Invalid query parameters, page must be a number, or page not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    description: Error message for validation failure or pagination error
                    type: string
        '429':
          description: Too many requests
          content:
            application/json:
              example:
              - detail: Request was throttled. Expected available in 60 seconds.
      tags:
      - Settings
      summary: Get allow list settings
      x-summary-source: derived
    post:
      operationId: Create allow list settings
      description: 'Add a new entry to the allow list for the specified company.

        Scopes:


        company.all


        company.edit'
      responses:
        '204':
          description: Allow list entry successfully added.
          content:
            application/json:
              example: {}
        '404':
          description: Company was not found
          content:
            application/json:
              example:
              - message: Company not found
        '403':
          description: Permission Denied
          content:
            application/json:
              example:
              - detail: Missing JWT
              - detail: You do not have permission to perform this action.
              - message: You do not have permission for company <company_id>
        '400':
          description: Invalid request body or allowed records limit reached
          content:
            application/json:
              schema:
                type: object
                properties:
                  error_message:
                    description: Error message for validation failure or limits reached
                    type: string
        '429':
          description: Too many requests
          content:
            application/json:
              example:
              - detail: Request was throttled. Expected available in 60 seconds.
      tags:
      - Settings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WhitelistAddRow'
        required: true
      summary: Create allow list settings
      x-summary-source: derived
    put:
      operationId: Update allow list entry
      description: 'Update an existing allow list entry for the specified company.

        Scopes:


        company.all


        company.edit'
      responses:
        '204':
          description: Allow list entry successfully updated.
          content:
            application/json:
              example: {}
        '404':
          description: Company was not found
          content:
            application/json:
              example:
              - message: Company not found
        '403':
          description: Permission Denied
          content:
            application/json:
              example:
              - detail: Missing JWT
              - detail: You do not have permission to perform this action.
              - message: You do not have permission for company <company_id>
        '400':
          description: Invalid request body or whitelist entry not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error_message:
                    description: Error message for validation failure or entry not found
                    type: string
        '429':
          description: Too many requests
          content:
            application/json:
              example:
              - detail: Request was throttled. Expected available in 60 seconds.
      tags:
      - Settings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WhitelistUpdateRow'
        required: true
      summary: Update allow list entry
      x-summary-source: derived
    delete:
      operationId: Delete allow list entries
      description: 'Delete selected entries from the allow list for the specified company.

        Scopes:


        company.all


        company.edit'
      responses:
        '204':
          description: Allow list entries successfully deleted.
          content:
            application/json:
              example: {}
        '404':
          description: Company was not found
          content:
            application/json:
              example:
              - message: Company not found
        '403':
          description: Permission Denied
          content:
            application/json:
              example:
              - detail: Missing JWT
              - detail: You do not have permission to perform this action.
              - message: You do not have permission for company <company_id>
        '400':
          description: Invalid request data
          content:
            application/json:
              schema:
                type: object
                properties:
                  error_message:
                    description: Error message for validation failure
                    type: string
        '429':
          description: Too many requests
          content:
            application/json:
              example:
              - detail: Request was throttled. Expected available in 60 seconds.
      tags:
      - Settings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WhiteListDelete'
        required: true
      summary: Delete allow list entries
      x-summary-source: derived
