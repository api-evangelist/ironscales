components:
  schemas:
    WhiteListEntry:
      description: List of allowed entries
      required:
      - id
      - date
      - value
      - type
      - scope
      - comment
      - user_first_name
      - user_last_name
      - user_email
      - external_campaigns
      - ignore_auth
      type: object
      properties:
        id:
          title: Id
          description: Unique identifier of the whitelist entry
          type: integer
        date:
          title: Date
          description: Date and time when the entry was created or modified
          type: string
          format: date-time
        value:
          title: Value
          description: Value of the whitelist entry (domain, IP, email, etc.)
          type: string
          minLength: 1
        type:
          title: Type
          description: 'Type of whitelist entry: 1 (IP Network), 2 (Domain), 3 (Sender Address), 4 (Unscanned Domain Link)'
          type: integer
        scope:
          title: Scope
          description: 'Scope of the whitelist entry: 1=Skip All Inspections, 2=Bypass Impersonation Banners, 3=Bypass link clicking by IRONSCALES, 4=Spam Filter, 6=Bypass all scanning for links'
          type: integer
          maximum: 6
          minimum: 1
        comment:
          title: Comment
          description: Optional comment for the entry
          type:
          - string
          - 'null'
          minLength: 1
        user_first_name:
          title: User first name
          description: First name of the user who created the entry
          type: string
          minLength: 1
        user_last_name:
          title: User last name
          description: Last name of the user who created the entry
          type: string
          minLength: 1
        user_email:
          title: User email
          description: Email of the user who created the entry
          type: string
          minLength: 1
        external_campaigns:
          title: External campaigns
          description: Whether this entry applies to external campaigns
          type: boolean
        ignore_auth:
          title: Ignore auth
          description: Whether authentication should be ignored for this entry
          type: boolean
    WhitelistAddRow:
      required:
      - type
      - value
      type: object
      properties:
        type:
          title: Type
          description: 'Type of whitelist entry. Choices: 1=IP Network (for IP addresses or CIDR notation), 2=Domain (for domain names), 3=Sender Address (for email addresses), 4=Unscanned Domain Link (for domain names in links)'
          type: string
          enum:
          - 1
          - 2
          - 3
          - 4
        scope:
          title: Scope
          description: 'Scope of the whitelist entry: 1=Skip All Inspections, 2=Bypass Impersonation Banners, 3=Bypass link clicking by IRONSCALES, 4=Spam Filter, 6=Bypass all scanning for links'
          type: integer
          default: 1
        value:
          title: Value
          description: 'Value to whitelist. For type=1: provide IP address or CIDR notation (e.g., 192.168.1.1 or 10.0.0.0/24). For type=2: provide domain name (e.g., example.com). For type=3: provide email address (e.g., user@example.com). For type=4: provide domain name for unscanned links.'
          type: string
          minLength: 1
        comment:
          title: Comment
          description: Optional comment or description for this whitelist entry
          type:
          - string
          - 'null'
        external_campaigns:
          title: External campaigns
          description: When true, this whitelist entry will also apply to external campaigns
          type: boolean
          default: false
        ignore_auth:
          title: Ignore auth
          description: When true, authentication will be ignored for this whitelist entry
          type: boolean
          default: false
    WhiteListResponse:
      required:
      - allow_list
      - internal_active
      - external_active
      - pages_count
      - page
      - items_per_page
      type: object
      properties:
        allow_list:
          description: List of allowed entries
          type: array
          items:
            $ref: '#/components/schemas/WhiteListEntry'
        internal_active:
          title: Internal active
          description: Whether internal whitelist is active
          type: boolean
        external_active:
          title: External active
          description: Whether external whitelist is active
          type: boolean
        pages_count:
          title: Pages count
          description: Total number of pages
          type: integer
        page:
          title: Page
          description: Current page number
          type: integer
        items_per_page:
          title: Items per page
          description: Number of items per page
          type: integer
    AccountTakeoverSettings:
      required:
      - sensitivity
      type: object
      properties:
        sensitivity:
          title: Sensitivity
          description: 'ATO sensitivity level: 1 (Aggressive), 2 (Balanced), 3 (Relaxed)'
          type: integer
          enum:
          - 1
          - 2
          - 3
    WhiteListDelete:
      required:
      - selected_ids
      type: object
      properties:
        selected_ids:
          description: List of allow list entry IDs to delete
          type: array
          items:
            type: integer
            minimum: 1
          minItems: 1
    NotificationSettings:
      required:
      - recipients
      type: object
      properties:
        recipients:
          type: array
          items:
            type: string
            format: email
            minLength: 1
    ChallengedSettings:
      required:
      - recipients
      type: object
      properties:
        recipients:
          type: array
          items:
            type: string
            format: email
            minLength: 1
    WhitelistUpdateRow:
      required:
      - type
      - value
      - selected_id
      type: object
      properties:
        type:
          title: Type
          description: 'Type of whitelist entry. Choices: 1=IP Network (for IP addresses or CIDR notation), 2=Domain (for domain names), 3=Sender Address (for email addresses), 4=Unscanned Domain Link (for domain names in links)'
          type: string
          enum:
          - 1
          - 2
          - 3
          - 4
        scope:
          title: Scope
          description: 'Scope of the whitelist entry: 1=Skip All Inspections, 2=Bypass Impersonation Banners, 3=Bypass link clicking by IRONSCALES, 4=Spam Filter, 6=Bypass all scanning for links'
          type: integer
          default: 1
        value:
          title: Value
          description: 'Value to whitelist. For type=1: provide IP address or CIDR notation (e.g., 192.168.1.1 or 10.0.0.0/24). For type=2: provide domain name (e.g., example.com). For type=3: provide email address (e.g., user@example.com). For type=4: provide domain name for unscanned links.'
          type: string
          minLength: 1
        comment:
          title: Comment
          description: Optional comment or description for this whitelist entry
          type:
          - string
          - 'null'
        external_campaigns:
          title: External campaigns
          description: When true, this whitelist entry will also apply to external campaigns
          type: boolean
          default: false
        ignore_auth:
          title: Ignore auth
          description: When true, authentication will be ignored for this whitelist entry
          type: boolean
          default: false
        selected_id:
          title: Selected id
          description: ID of the existing allow list entry to update.
          type: integer
          minimum: 1
  securitySchemes:
    JWT:
      type: apiKey
      name: Authorization
      in: header
