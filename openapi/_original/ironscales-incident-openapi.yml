  /incident/{company_id}/stats/remediation-statuses/:
    parameters:
    - name: company_id
      in: path
      required: true
      type: string
    get:
      operationId: Remediation statuses stats
      description: '<b>Rate Limit</b>: 20 requests per second<br /><b>Scopes:</b><ul><li>company.view</li></ul>'
      parameters:
      - name: start_time
        in: query
        description: iso-8601 format
        required: true
        type: string
        format: date-time
      - name: end_time
        in: query
        description: iso-8601 format
        required: true
        type: string
        format: date-time
      - name: include_scanback
        in: query
        required: false
        type: boolean
        default: false
      responses:
        '200':
          description: Successful Response
          schema:
            $ref: '#/definitions/RemediationStatusesStats'
        '400':
          description: Validation Errors
          examples:
            application/json:
            - end_time:
              - This field is required.
              start_time:
              - This field is required.
            - end_time:
              - 'Datetime has wrong format. Use one of these formats instead: YYYY-MM-DDThh:mm[:ss[.uuuuuu]][+HH:MM|-HH:MM|Z].'
              start_time:
              - 'Datetime has wrong format. Use one of these formats instead: YYYY-MM-DDThh:mm[:ss[.uuuuuu]][+HH:MM|-HH:MM|Z].'
            - end_time:
              - The `end_time` must be later than the `start_time`.
            - end_time:
              - The time range between `start_time` and `end_time` cannot exceed 365 days.
            - include_scanback:
              - Must be a valid boolean.
        '404':
          description: Company was not found
          examples:
            application/json:
            - message: Company not found
        '403':
          description: Permission Denied
          examples:
            application/json:
            - detail: Missing JWT
            - detail: You do not have permission to perform this action.
            - message: You do not have permission for company <company_id>
        '429':
          description: Too many requests
          examples:
            application/json:
            - detail: Request was throttled. Expected available in 60 seconds.
      tags:
      - Incident
