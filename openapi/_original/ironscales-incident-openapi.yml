      tags:
      - Incident
  /incident/{company_id}/{status}/:
    parameters:
    - name: company_id
      in: path
      required: true
      type: string
    - name: status
      in: path
      required: true
      type: string
    get:
      operationId: Get IDs list of unclassified incidents
      description: "Get ids of open incidents<br/>\n<br/><b>Scopes:</b>\n<ul>\n    <li>partner.all</li>\n    <li>partner.company.view</li>\n\
        \    <li>company.view</li>\n</ul>\n<br/><b>Status:</b>\n<ul><li>open</li></ul>"
      parameters:
      - name: company_id
        in: path
        description: company id
        required: true
        type: integer
      responses:
        '200':
          description: Successful Response
          examples:
            application/json:
              incident_ids:
              - 1
              - 2
              - 3
        '404':
          description: No company were found that matching the query
        '403':
          description: No permissions
      tags:
      - Incident
