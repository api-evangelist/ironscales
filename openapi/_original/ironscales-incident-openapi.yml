        title: Original cluster incident id
        description: The ID of the original incident this was reclassified from (null if not reclassified)
        type: integer
        x-nullable: true
      can_revert:
        title: Can revert
        description: Can be reverted to the original incident
        type: boolean
      revert_blocked_reason:
        title: Revert blocked reason
        description: Why revert is not possible (null if revert is possible)
        type: string
        minLength: 1
        x-nullable: true
      resolution_tags:
        description: Tags on the incident whose type matches the incident's current classification (Phishing/Spam/Safe). Empty
          list when none.
        type: array
        items:
          type: string
          minLength: 1
      additional_tags:
        description: Tags on the incident whose type does not match the current classification (e.g. left over from a prior
          classification). Empty list when none.
        type: array
        items:
          type: string
          minLength: 1
      threat_type:
        title: Threat type
        description: Categorized threat/attack label derived from Themis (e.g. 'VIP Impersonation', 'Business Email Compromise').
          Empty string when Themis is disabled or produced no label.
        type: string
      comments:
        description: Comments on the incident, across the internal and community threads.
        type: array
        items:
          $ref: '#/definitions/IncidentComment'
