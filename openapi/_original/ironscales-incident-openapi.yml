    get:
      operationId: Get Account Takeover incident details
      description: "\nRetrieve detailed information about a specific Account Takeover incident.\n<br/><br/>\n<b>Query Parameters:</b>\n\
        <ul>\n    <li><b>page:</b> Page number for pagination (default: 1)</li>\n    <li><b>items_per_page:</b> Number of\
        \ items per page (min: 1, max: 500, default: 50)</li>\n    <li><b>title:</b> Filter by alert titles (can specify multiple)</li>\n\
        \    <li><b>location:</b> Filter by locations (can specify multiple)</li>\n    <li><b>ip:</b> Filter by IP addresses\
        \ with validation (can specify multiple)</li>\n</ul>\n<br/><b>Response Data:</b>\n<ul>\n    <li><b>incident_details:</b>\
        \ Complete incident information with account details and alerts</li>\n    <li><b>filter_options:</b> Available filter\
        \ values for dropdown menus</li>\n    <li><b>pagination:</b> Page count and current page information</li>\n</ul>\n\
        <br/><b>Scopes:</b>\n<ul>\n    <li>company.all</li>\n    <li>company.view</li>\n</ul>\n"
      parameters:
      - name: page
        in: query
        description: Page number for pagination results. Starts at 1.
        required: false
        type: integer
        default: 1
        minimum: 1
      - name: items_per_page
        in: query
        description: 'Number of items per page. Min: 1, Max: 500, Default: 50.'
        required: false
        type: integer
        default: 50
        maximum: 500
        minimum: 1
      - name: title
        in: query
        description: List of alert titles to filter by.
        required: false
        type: array
        items:
          type: string
          maxLength: 200
          minLength: 1
      - name: location
        in: query
        description: List of locations to filter by.
        required: false
        type: array
        items:
          type: string
          maxLength: 200
          minLength: 1
      - name: ip
        in: query
        description: List of IPv4 or IPv6 addresses to filter by.
        required: false
        type: array
        items:
          type: string
          minLength: 1
      responses:
