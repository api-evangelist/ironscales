  /incident/{company_id}/account-takeover/{incident_id}/remediation/:
    parameters:
    - name: company_id
      in: path
      required: true
      type: string
    - name: incident_id
      in: path
      required: true
      type: string
    post:
      operationId: Create Account Takeover remediation
      description: "\nCreate remediation for the specified Account Takeover incident.\n<br/><br/>\n<b>State Options:</b>\n\
        <ul>\n    <li><b>2 (Safe):</b> Mark the incident as safe/false positive</li>\n    <li><b>3 (Compromised):</b> Mark\
        \ the incident as compromised and apply remediation actions</li>\n</ul>\n<br/><b>Remediation Actions:</b>\n<ul>\n\
        \    <li><b>3 (SIGN_OUT):</b> Revoke user's Microsoft 365 sessions - only allowed for state 3 (Compromised)</li>\n\
        \    <li><b>4 (DISABLE_ACCOUNT):</b> Disable user's Microsoft 365 account - only allowed for state 3 (Compromised)</li>\n\
        </ul>\n<br/><b>Validation Rules:</b>\n<ul>\n    <li>Remediation actions can only be applied when marking incident\
        \ as compromised (state=3)</li>\n    <li>When marking incident as safe (state=2), no action should be provided</li>\n\
        </ul>\n<br/><b>Scopes:</b>\n<ul>\n    <li>company.all</li>\n    <li>company.edit</li>\n</ul>\n"
      parameters:
      - name: data
        in: body
        required: true
        schema:
          $ref: '#/definitions/AccountTakeoverRemediation'
      responses:
        '200':
          description: Successfully updated incident state and applied remediation actions.
          schema:
            $ref: '#/definitions/AccountTakeoverRemediationResponse'
          examples:
            application/json:
              state: 3
        '400':
          description: Invalid request body - validation errors
          schema:
            $ref: '#/definitions/AccountTakeoverRemediationError'
          examples:
            application/json:
              data:
                state:
                - This field is required.
                action:
                - Remediation actions are only allowed when marking incident as compromised (state=3).
        '404':
          description: Company was not found
          examples:
            application/json:
            - message: Company not found
        '403':
          description: Permission Denied
          examples:
            application/json:
            - detail: Missing JWT
            - detail: You do not have permission to perform this action.
            - message: You do not have permission for company <company_id>
        '429':
          description: Too many requests
          examples:
            application/json:
            - detail: Request was throttled. Expected available in 60 seconds.
      tags:
      - Incident
