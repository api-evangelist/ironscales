    post:
      operationId: Recluster incident
      description: "Recluster (revert) mitigations back to the original incident they were unclustered from.<br/>\nThis reverses\
        \ a previous uncluster operation by moving mitigations back to their original incident.<br/>\n<br/><b>Scopes:</b>\n\
        <ul>\n    <li>partner.company.classify</li>\n    <li>company.classify</li>\n</ul>"
      parameters:
      - name: data
        in: body
        required: true
        schema:
          $ref: '#/definitions/ReclusterIncident'
      - name: company_id
        in: path
        description: company id
        required: true
        type: integer
      - name: incident_id
        in: path
        description: incident id (the unclustered incident to recluster from)
        required: true
        type: integer
      responses:
        '200':
          description: Successful Response
          examples:
            application/json:
              report_id: 12345
              mitigation_id: 67890
              count: 5
              newState: Attack
        '400':
          description: Error explanation in error_message
          examples:
            application/json:
              error_message: explanation
        '404':
          description: Incident/company were not found or incident was not unclustered
        '403':
          description: No permissions
      tags:
      - Incident
