        type: array
        items:
          type: integer
      resolved_by:
        title: Resolved by
        description: Who classified the incident. Null when is_reclassified is true (use reclassified_by for that case).
        type: string
        minLength: 1
        x-nullable: true
      resolved_on:
        title: Resolved on
        description: When the incident was classified. Null when is_reclassified is true (use reclassified_on for that case).
        type: string
        format: date-time
        x-nullable: true
      reclassified_by:
        title: Reclassified by
        description: Who reclassified this incident from another cluster. Only set when is_reclassified is true; null otherwise.
          Uses the same resolver source as resolved_by for non-reclassified incidents.
        type: string
        minLength: 1
        x-nullable: true
      reclassified_on:
        title: Reclassified on
        description: When the incident was reclassified from another cluster. Only set when is_reclassified is true; null
          otherwise. Uses the same resolver source as resolved_on for non-reclassified incidents.
        type: string
        format: date-time
        x-nullable: true
