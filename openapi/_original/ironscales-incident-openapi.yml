                  created: '2024-01-15T10:25:00Z'
                state: 1
                original_state: 1
                resolved_by: Jane Smith
                resolved_on: '2024-01-15T14:30:00Z'
                created: '2024-01-15T10:25:00Z'
                assignee:
                  id: 789
                  email: security@company.com
                  first_name: Security
                  last_name: Team
