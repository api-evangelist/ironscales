      description: <p>Retrieve a paginated list of call for action pages available for the specified company. The endpoint
        returns system pages, public pages, company-owned pages, and brand owner pages (if the company is part of a brand).
        Results can be filtered by search term. </p><b>Scopes:</b><ul><li>company.view</li><li>partner.company.view</li></ul>
      parameters:
      - name: page
        in: query
        description: 'Page number for pagination (default: 1)'
        required: false
        type: integer
        default: 1
        minimum: 1
      - name: page_size
        in: query
        description: 'Number of items per page (default: 25, max: 50)'
        required: false
        type: integer
        default: 25
        maximum: 50
        minimum: 1
      - name: search
        in: query
        description: Search term to filter call for action pages by name
        required: false
        type: string
      responses:
        '200':
          description: Successfully retrieved call for action pages
          schema:
            $ref: '#/definitions/CallForAction'
          examples:
            application/json:
              page: 1
              total_pages: 2
              total_count: 35
              data:
              - id: 1
                name: Example Call for Action
                page_title: Example Title
                content: <html><form>...</form></html>
                is_system: true
                is_public: true
                last_updated: '2023-01-16T09:45:32.051421Z'
                tags: System
                company_id: null
        '400':
          description: Bad Request - Invalid request parameters or validation error
          examples:
            application/json:
              field_name:
