  /sat/{company_id}/setup/:
    parameters:
    - name: company_id
      in: path
      required: true
      type: string
    get:
      operationId: Get Campaign Setup
      description: '

        Retrieve campaign setup and settings data for the specified company.

        This endpoint provides configuration data needed for campaign creation and management,

        including license limits, training content vendors, default content templates, and company settings.

        <b>Scopes:</b><ul><li>company.view</li><li>partner.company.view</li></ul>'
      parameters:
      - name: company_id
        in: path
        description: Company ID
        required: true
        type: integer
      responses:
        '200':
          description: Successful response containing campaign setup data
          schema:
            $ref: '#/definitions/CampaignSetup'
          examples:
            application/json:
              languages:
              - id: 1
                name: English
                short_name: En
                localized_name: English
                ltr: true
                enabled: true
                default: true
              - id: 2
                name: Hebrew
                short_name: He
                localized_name: עברית
                ltr: false
                enabled: true
                default: false
              timezone: Asia/Jerusalem
              workdays: 1
              campaigns_limit_for_year: null
              campaign_mails_limit: null
              allowed_senders_for_training_campaigns:
              - ironscales Security Team (IRONSCALES) <training@ironscales.com>
              manager_notification_state: 3
              default_training_reminder_content_simulation:
                en:
                  body: "\n<p>\n    Hi {first_name},\n</p>\n\n<p>\n    You recently fell for a simulated phishing attack.\
                    \ \n    To give you the tools to recognize malicious emails in the future, \n    please watch the Phishing\
                    \ Awareness Training video.\n<p/>\n\n<p>\n    Please click the link below to start the training. It will\
                    \ only take a few minutes.\n    <br/>\n    {training_page_url}\n<p/>\n\n<p>\n    Thank you,\n    <br/>\n\
                    \    The {company_name} Security Team\n</p>\n"
                  subject: Complete your anti-phishing training today
                he:
                  body: "\n<div dir=\"rtl\">    \n<p>\n   שלום {first_name},\n</p>\n\n<p>\n    לאחרונה נפלת להתקפת דיוג (פישינג)\
                    \ מדומה. על מנת לתת לך את הכלים לזהות הודעות דו\"ל זדוניות בעתיד, אנא צפה בלומדת אבטחת המידע המצורפת.\n\
                    <p/>\n\n<p>\nאנא לחץ על הקישור להלן כדי להתחיל את הלימודה. זה ייקח רק מספר דקות.\n    <br/>\n    {training_page_url}\n\
                    <p/>\n\n<p>\n    בברכה,\n    <br/>\n   צוות אבטחת המידע {company_name}.\n</p>\n</div>\n"
                  subject: השלם/י את לומדת אבטחת המידע היום
              default_training_reminder_content_training:
                en:
                  body: "\n<div style=\"font-size: 16px; margin-bottom: 25px;\">\n    Hi <b>{{ first_name }}</b>,\n</div>\n\
                    <div style=\"max-width: 445px; margin-bottom: 28px;\">\n    <div>\n        This is a friendly reminder\
                    \ that you haven't completed your Security Awareness Training yet.\n    </div>\n    <div>\n        Please\
                    \ complete the training by clicking the video below. It will only take a few minutes.\n    </div>\n</div>"
                  subject: 'Security Awareness Training: {{ module_title }}'
                he:
                  body: "\n<div style=\"font-size: 16px; margin-bottom: 25px;\">\n    ,<b>{{ first_name }}</b> שלום\n</div>\n\
                    <div style=\"max-width: 445px; margin-bottom: 28px;\">\n    <div>\n        .זוהי תזכורת על כך שעדיין לא\
                    \ השלמת הדרכה בנושא מודעות לאבטחה\n    </div>\n    <div>\n        .נא להשלים את ההדרכה על-ידי לחיצה על\
                    \ הסרטון למטה. זה ייקח רק מספר דקות\n    </div>\n</div>"
                  subject: הדרכה בנושא מודעות לאבטחה {{ module_title }}
              default_campaign_failed_alert_content:
                en:
                  body: '<p>Dear {first_name}</p>


                    <p>In our ongoing effort to prevent email phishing at {company_name}, we have launched an anti-phishing
                    campaign.</p>


                    <p>Unfortunately, you fell for a phishing attempt and did not pass the test. Please take a few minutes
                    to watch the training video linked: {training_page_url}</p>


                    <p>Thank you for your participation,<br />

                    {company_name}</p>


                    <p>Security Team</p>'
                  subject: Action Required - Complete Your anti-phishing Training
                he:
                  body: "\n<div dir=\"rtl\">\n<p>\n    שלום {first_name},\n</p>\n\n<p>\nבמאמץ המתמשך למנוע התקפות פישינג ב\
                    \ {company_name}, ביצענו תרגיל אבטחת מידע.\n</p>\n\n<p>\nלצערנו נפלת בתרגיל ולכן עליך לצפות בלומדה בנושא\
                    \ אבטחת מידע. אנא לחץ על הקישור:  {training_page_url}\n</p>\n\n<p>\nתודה על השתתפותך,\n<br />{company_name}\n\
                    </p>\n\n<p>\nצוות אבטחת המידע\n</p>\n</div>\n"
                  subject: השלם את הלומדה בנושא אבטחת מידע
              default_manager_notification_banner_content:
                en:
                  text: '

                    Your manager, {manager_full_name}, will be notified that you have not yet completed the mandatory training.

                    Please complete it as soon as possible

                    '
                he:
                  text: '

                    המנהל שלך,{manager_full_name}, יקבל התראה שעדיין לא השלמת את הציפייה בלומדת החובה. אנא השלם זאת בהקדם
                    האפשרי.

                    '
              default_manager_report_email_content:
                en:
                  body: '

                    Dear {first_name},


                    As part of the "{campaign_name}" campaign, we wanted to notify you that some employees on your team have
                    not yet completed their mandatory training, despite receiving {reminders_count} or more automated reminders.

                    These employees have been informed that their incomplete status has been shared with you.

                    We have attached a file with the details of the employees who have not finished their assigned training.

                    Please review the attached file for more information.


                    Best regards,

                    {company_name}

                    '
                  subject: Employees with Incomplete Training for "{campaign_name}"
                he:
                  body: '

                    שלום {first_name},


                    כחלק מקמפיין "{campaign_name}", ברצוננו ליידע אותך כי יש עובדים בצוות שלך שעדיין לא השלימו את הציפייה
                    בלומדת החובה, על אף שקיבלו {reminders_count} תזכורות אוטומטיות.

                    עובדים אלה קיבלו הודעה כי הינך מיודע על כך שהם לא השלימו את הציפייה בלומדת.


                    מצורף למייל זה קובץ המכיל את כל פרטי העובדים שטרם השלימו את הלומדת.


                    בברכה,

                    {company_name}

                    '
                  subject: עובדים שטרם השלימו את הציפייה בלומדת עבור קמפיין  -  "{campaign_name}"
        '404':
          description: Company was not found
          examples:
            application/json:
            - message: Company not found
        '403':
          description: Permission Denied
          examples:
