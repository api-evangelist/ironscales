definitions:
  AwarenessLevelsDistribution:
    description: "Get awareness levels distribution.\n\n        Args:\n            content: Dictionary containing participants\
      \ queryset.\n\n        Returns:\n            Dictionary with awareness level distribution (beginner, mid, expert).\n"
    type: object
    properties:
      beginner:
        title: Beginner
        type: integer
        readOnly: true
      mid:
        title: Mid
        type: integer
        readOnly: true
      expert:
        title: Expert
        type: integer
        readOnly: true
  BaseTrainingSubtitle:
    type: object
    properties:
      locale_id:
        title: Locale id
        type: integer
        readOnly: true
      url:
        title: Url
        type: string
        readOnly: true
        minLength: 1
  CallForAction:
    required:
    - page
    - total_pages
    - total_count
    - data
    type: object
    properties:
      page:
        title: Page
        description: Current page number
        type: integer
      total_pages:
        title: Total pages
        description: Total number of pages
        type: integer
      total_count:
        title: Total count
        description: Total number of call for action pages matching the query
        type: integer
      data:
        description: List of call for action pages for the current page
        type: array
        items:
          $ref: '#/definitions/CallForActionData'
  CallForActionData:
    description: List of call for action pages for the current page
    required:
    - id
    - name
    - page_title
    - content
    - is_system
    - is_public
    - last_updated
    - company_id
    type: object
    properties:
      id:
        title: Id
        description: Unique identifier for the call for action page
        type: integer
      name:
        title: Name
        description: Name of the call for action page
        type: string
        minLength: 1
      page_title:
        title: Page title
        description: Title of the call for action page
        type: string
        x-nullable: true
      content:
        title: Content
        description: HTML content of the call for action page
        type: string
        x-nullable: true
      is_system:
        title: Is system
        description: Whether the call for action page is a system page
        type: boolean
      is_public:
        title: Is public
        description: Whether the call for action page is public
        type: boolean
      last_updated:
        title: Last updated
        description: Date and time when the call for action page was last updated
        type: string
        format: date-time
      tags:
        title: Tags
        description: Tags indicating the origin of the call for action page (System, Company, or Partner)
        type: string
        readOnly: true
        minLength: 1
        x-nullable: true
      company_id:
        title: Company id
        description: ID of the company that owns this call for action page (null for system pages)
        type: integer
        x-nullable: true
  CampaignCreateRequest:
    required:
    - name
    - flow_type
    - schedule_time
    - close_time
    - default_locale_id
    - participants_choices
    type: object
    properties:
      name:
        title: Name
        description: Campaign name
        type: string
        maxLength: 250
        minLength: 1
      flow_type:
        title: Flow type
        description: 'Campaign Flow Type:

          - `1` = Training Only - Campaign that only includes training content

          - `2` = Simulation and Training - Campaign that includes both phishing simulation and training'
        type: integer
        enum:
        - 1
        - 2
      schedule_time:
        title: Schedule time
        description: Campaign start time in ISO 8601 format
        type: string
        format: date-time
      close_time:
        title: Close time
        description: Campaign close time in ISO 8601 format
        type: string
        format: date-time
      default_locale_id:
        title: Default locale id
        description: Default locale ID for the campaign
        type: integer
      participants_choices:
        $ref: '#/definitions/ParticipantsCalculateInclude'
      end_date:
        title: End date
        description: Campaign end date (for simulation campaigns)
        type: string
        format: date
        x-nullable: true
      timezone:
        title: Timezone
        description: Timezone string (e.g., 'America/New_York'). Defaults to company timezone if not provided
        type: string
      selected_locale_ids:
        description: List of additional locale IDs for the campaign
        type: array
        items:
          type: integer
        default: []
      email_limit:
        title: Email limit
        description: Maximum number of emails to send per day. Maximum allowed value is 20000. Use 0 for no limit.
