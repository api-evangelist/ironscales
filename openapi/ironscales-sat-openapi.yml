            - message: You do not have permission for company <company_id>
        '429':
          description: Too many requests
          examples:
            application/json:
            - detail: Request was throttled. Expected available in 60 seconds.
      tags:
      - SAT
  /sat/{company_id}/templates/:
    parameters:
    - name: company_id
      in: path
      required: true
      type: string
    get:
      operationId: Get Templates List
      summary: Get templates list.
      description: 'Returns a paginated list of mail templates filtered by various criteria

        including locale, creator, type, level, category, and search term.<b>Scopes:</b><ul><li>company.view</li><li>partner.company.view</li></ul>'
      parameters:
      - name: page
        in: query
        required: false
        type: integer
        default: 1
        minimum: 1
      - name: page_size
        in: query
        required: false
        type: integer
        default: 25
        maximum: 50
        minimum: 1
      - name: created_by
        in: query
        description: 'Filter by template creator codes.

          - `1` = System - Templates provided by the system

          - `2` = Company - Templates owned by the current company

          - `3` = MSP - Templates provided by the MSP

          - `4` = Community - Community-contributed templates

          - Provide one or more codes'
        required: false
        type: array
        items:
          type: integer
          enum:
          - 1
          - 2
          - 3
          - 4
      - name: locale_ids
        in: query
        description: 'Filter by locale IDs.

          - Use numeric identifiers from the locale catalog

          - If not provided, company''s selected locales will be used'
        required: false
        type: array
        items:
          type: integer
      - name: type
        in: query
        description: 'Filter by template type codes.

          - `0` = Drive-by (links)

          - `1` = Attachment

          - `2` = Call for Action'
        required: false
        type: array
        items:
          type: integer
          enum:
          - 0
          - 1
          - 2
      - name: search
        in: query
        required: false
        type: string
      - name: category_ids
        in: query
        description: Filter by template category (scenario group) IDs. - Use endpoint /appapi/sat/{company_id}/templates/categories/
          to get the list of available categories
        required: false
        type: array
        items:
          type: integer
      - name: level
        in: query
        description: 'Array of integers

          Filter by template level (difficulty) codes.

          - `0` = Beginner

          - `1` = Intermediate

          - `2` = Advanced'
        required: false
        type: array
        items:
          type: integer
          enum:
          - 0
          - 1
          - 2
      - name: sort
        in: query
        description: 'Field to sort templates by:

          - `last_updated` - Sort by last updated date

          - `name` - Sort by template name

          - `avg_click_rate` - Sort by average click rate (per selected locales)

          - `avg_reported_rate` - Sort by average reported rate (per selected locales)'
        required: false
        type: string
        enum:
        - last_updated
        - name
        - avg_click_rate
        - avg_reported_rate
      - name: order
        in: query
        description: 'Sort order: `asc` for ascending, `desc` for descending'
        required: false
        type: string
        enum:
        - asc
        - desc
        default: asc
      responses:
        '200':
          description: ''
          schema:
            $ref: '#/definitions/TemplatesListResponse'
        '400':
          description: Bad Request - Invalid request parameters or validation error
          examples:
            application/json:
              field_name:
              - Field related error message.
        '401':
          description: Unauthorized - Authentication credentials were not provided or are invalid
          examples:
            application/json:
              detail: Authentication credentials were not provided.
        '403':
          description: Forbidden - You do not have permission to perform this action
          examples:
            application/json:
              detail: You do not have permission for company 123
        '404':
          description: Not Found - The requested resource was not found
          examples:
