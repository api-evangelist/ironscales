        description: 'The action to perform on participants:<br/>1 - Reported: Mark as reported<br/>2 - Manually Trained:
          Set training status to manually trained<br/>3 - Postponed: Set training status to postponed (requires expiration_date)<br/>4
          - Revert Training: Revert Postponed and Manually Trained statuses only<br/>5 - Revert Reported: Revert Reported
          status set via appapi only'
        type: integer
        enum:
        - 1
        - 2
        - 3
        - 4
        - 5
      expiration_date:
