- https
consumes:
- application/json
produces:
- application/json
securityDefinitions:
  JWT:
    type: apikey
    name: Authorization
    in: header
security:
- JWT: []
tags:
- name: Campaigns
paths:
  /campaigns/{company_id}/details:
    parameters:
    - name: company_id
      in: path
      required: true
      type: string
    get:
      operationId: Get campaigns details
      description: "Get campaigns details <br/>\nEach page contains 25 campaigns results<br/>\n<br/><b>Scopes:</b>\n<ul>\n\
        \    <li>partner.all</li>\n    <li>partner.company.view</li>\n    <li>company.view</li>\n</ul>\n\nStatuses mapping\
        \ to UI values:\n<ul>\n    <li>Draft (0) -> Draft</li>\n    <li>Collecting (1) -> Active</li>\n    <li>Closed (2)\
        \ -> Completed</li>\n    <li>Approved by User (3) -> Pending</li>\n    <li>Sending (4) -> Active</li>\n    <li>Inactive\
        \ (5) -> Inactive</li>\n</ul>"
      parameters:
      - name: company_id
        in: path
        description: Company ID
        type: integer
        required: true
      - name: period
        in: query
        description: "<p>Applied over campaign creation date</p>\n                                <ul>\n                 \
          \               <li>0 - Last 24 hours</li>\n                                <li>1 - Last 7 days</li>\n         \
          \                       <li>2 - Last 90 days</li>\n                                <li>3 - Last 180 days</li>\n\
          \                                <li>4 - Last 360 days</li>\n                                <li>5 - Current year\
          \ to date</li>\n                                <li>6 - All time</li>\n                                </ul>\n"
        required: true
        type: integer
      - name: status
        in: query
        description: "<ul>\n                                <li>0 - Draft</li>\n                                <li>1 - Collecting</li>\n\
          \                                <li>2 - Closed</li>\n                                <li>3 - Approved</li>\n  \
          \                              <li>4 - Sending</li>\n                                </ul>\n                   \
          \             <p>Can be multiple statuses: status=0&status=2&status=3...</p>\n"
        required: false
        type: array
        items:
          type: integer
        default:
        - 2
      - name: page
        in: query
        description: Page number
        required: false
        type: integer
        default: 1
      - name: name
        in: query
        description: Optional, search by partial campaign name
        required: false
        type: string
      responses:
        '200':
          description: Successfully Response
          schema:
            $ref: '#/definitions/CampaignDetailsPage'
        '400':
          description: Missing or wrong period
          examples:
            application/json:
              error_message: explanation
        '404':
          description: Company or campaign does not exist
        '403':
          description: No permissions
      consumes: []
      tags:
      - Campaigns
  /campaigns/{company_id}/participants-actions/:
    parameters:
    - name: company_id
      in: path
      required: true
      type: string
    put:
      operationId: Perform participants action
      description: Perform action on campaign participants.<br/><b>Scopes:</b><ul><li>partner.company.edit</li><li>company.edit</li></ul>
      parameters:
      - name: data
        in: body
        required: true
        schema:
          $ref: '#/definitions/ParticipantsActionsRequest'
      - name: campaign_id
        in: query
        description: Campaign ID
        required: true
        type: integer
      responses:
        '200':
          description: Successfully updated
          schema:
            type: object
            properties:
              success:
                description: Indicates if the action was successful
                type: boolean
        '400':
          description: Invalid request
          examples:
            application/json:
              message: explanation
        '403':
          description: No permissions
        '413':
          description: Too many emails
          examples:
            application/json:
              message: The emails list exceeds the maximum allowed limit of 300.
      tags:
      - Campaigns
  /campaigns/{company_id}/participants-details:
    parameters:
    - name: company_id
      in: path
      required: true
      type: string
    get:
      operationId: Get campaign participants details
      description: "Get campaign participants details <br/>\nEach page contains 100 participants<br/>\n<br/><b>Scopes:</b>\n\
        <ul>\n    <li>partner.all</li>\n    <li>partner.company.view</li>\n    <li>company.view</li>\n</ul>"
      parameters:
      - name: company_id
        in: path
        description: Company ID
        type: integer
        required: true
      - name: campaign_id
        in: query
        description: Campaign ID
        required: true
        type: integer
      - name: page
        in: query
        description: Page number
        required: false
        type: integer
        default: 1
      responses:
        '200':
          description: Successfully Response
          schema:
            $ref: '#/definitions/CampaignParticipantsDetailsPage'
        '400':
          description: Missing or a wrong Campaign
          examples:
            application/json:
              error_message: explanation
        '404':
          description: Company or page not found
        '403':
          description: No permissions
      tags:
      - Campaigns
