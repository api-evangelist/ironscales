idempotency:
  supported: false
  header: none
  evidence: >-
    No Idempotency-Key (or equivalent) header parameter appears anywhere in the specification, and the
    docs publish no retry-safety contract. The write surface includes non-idempotent POSTs — Create
    Account Takeover remediation, Classify specific incident, Recluster/Uncluster incident, Create Draft
    Campaign, Approve/Stop Campaign, and the four Settings create/append operations — with no
    deduplication guarantee, so a retried write after a timeout may take effect twice. PUT operations
    (Perform participants action, Bulk edit of a company mailboxes, Update account takeover sensitivity
    settings, Update allow list entry, Append challenged notification settings) are idempotent only by
    HTTP-method convention, not by any published guarantee.
  agent_guidance: >-
    Treat every POST in this API as at-most-once. Do not auto-retry a POST on timeout or 5xx; re-read
    state (Get details of specific incident, Get Campaign Details, Get allow list settings) and reconcile
    before issuing another write.
