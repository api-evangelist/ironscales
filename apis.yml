apis:
- name: IRONSCALES MCP Server
  description: >-
    Remote Model Context Protocol server operated by IRONSCALES at mcp.ironscales.com, served over streamable
    HTTP at /mcp/. Access is OAuth 2.0 protected — an unauthenticated tools/list returns an RFC 6750 challenge
    pointing at RFC 9728 protected-resource metadata, which names members.ironscales.com as the authorization
    server (authorization code + PKCE S256, refresh tokens, and RFC 7591 dynamic client registration).
    The live tool manifest requires an authenticated session and is not published anonymously.
  humanURL: https://ironscales.com/platform/agents
  baseURL: https://mcp.ironscales.com/mcp/
