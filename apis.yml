apis:
- name: IRONSCALES Management API
  description: >-
    The public IRONSCALES Management API — a Swagger 2.0 (drf-yasg) contract covering incident retrieval and
    classification, account-takeover remediation, mitigation and email statistics, escalated emails, mailbox
    listing and compliance reporting, deepfake SIEM events, phishing-simulation campaigns and participant
    actions, SAT training/landing-page/template catalogs, and per-tenant security settings (allow list,
    incident alerts, challenged alerts, account-takeover sensitivity). Tenant-scoped: nearly every operation
    takes a company_id path parameter. Authentication is a JWT obtained from the /get-token/ operation using
    the APP API token generated in the IRONSCALES dashboard, presented in the Authorization header. Documented
    throttling limit is 120 API calls per minute per company.
  humanURL: https://appapi.ironscales.com/appapi/docs/
  baseURL: https://appapi.ironscales.com/appapi
