aid: ironscales
name: IRONSCALES
description: >-
  IRONSCALES is an AI-powered, API-based email security platform protecting organizations against phishing,
  business email compromise (BEC), account takeover (ATO), VIP impersonation, QR-code phishing, malicious URLs
  and attachments, and deepfake-assisted social engineering. Rather than sitting inline as a secure email
  gateway, IRONSCALES connects to Microsoft 365 and Google Workspace through their APIs and operates at the
  mailbox level — no MX record changes — combining adaptive AI detection, computer-vision analysis, automated
  multi-mailbox remediation, a crowdsourced threat-intelligence network, phishing simulation testing, and
  security awareness training in one platform. The public IRONSCALES Management API (appapi.ironscales.com)
  exposes incidents, mitigation statistics, escalated emails, mailbox management, deepfake SIEM events,
  phishing-simulation campaigns, SAT training campaigns, and tenant security settings, and is the surface
  behind the company's SIEM/SOAR/XDR integrations. IRONSCALES also operates an OAuth-protected remote MCP
  server for agent-based access.
